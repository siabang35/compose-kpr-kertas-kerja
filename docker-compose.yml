# ==============================================================================
# Docker Compose: KPR Kertas Kerja Stack (API + Nginx Reverse Proxy)
# Images dari GCP Artifact Registry:
# - asia-southeast2-docker.pkg.dev/common-cicd-dev-01/gc-bribrain-dev-gar-temp-01/kpr-kertas-kerja-api:latest
# - asia-southeast2-docker.pkg.dev/common-cicd-dev-01/gc-bribrain-dev-gar-temp-01/kpr-kertas-kerja-nginx:latest
# ==============================================================================

version: "3.8"

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ----------------------------------------------------------------------------
  # 1. Service Backend API: FastAPI KPR Kertas Kerja
  # ----------------------------------------------------------------------------
  kpr-kertas-kerja-api:
    image: ${API_IMAGE:-asia-southeast2-docker.pkg.dev/common-cicd-dev-01/gc-bribrain-dev-gar-temp-01/kpr-kertas-kerja-api:latest}
    container_name: kpr-kertas-kerja-api
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      LIMIT_CONCURRENCY: ${LIMIT_CONCURRENCY:-256}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-kpr_analysis}
      POSTGRES_USER: ${POSTGRES_APP_USER:-kpr_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
      KPR_API_KEY: ${KPR_API_KEY:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    networks:
      kpr-network:
        aliases:
          - api
          - kpr-kertas-kerja-api
    ports:
      # Port internal loopback API untuk direct testing / debugging di VM:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-2.0}"
          memory: 2G

  # ----------------------------------------------------------------------------
  # 2. Service Reverse Proxy: Nginx Gateway (Port 8000 / 80)
  # ----------------------------------------------------------------------------
  kpr-kertas-kerja-nginx:
    image: ${NGINX_IMAGE:-asia-southeast2-docker.pkg.dev/common-cicd-dev-01/gc-bribrain-dev-gar-temp-01/kpr-kertas-kerja-nginx:latest}
    container_name: kpr-kertas-kerja-nginx
    restart: unless-stopped
    logging: *logging
    ports:
      # Port ekspose utama layanan KPR Kertas Kerja di VM (default 8000):
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      kpr-kertas-kerja-api:
        condition: service_healthy
    networks:
      - kpr-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  kpr-network:
    name: kpr-network
    driver: bridge