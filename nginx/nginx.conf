# ==============================================================================
# Nginx Reverse Proxy: KPR Kertas Kerja
# Meroutingkan trafik dari port publik ke container kpr-kertas-kerja-api:8000
# ==============================================================================

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_request_id $req_id {
    "~^[A-Za-z0-9._:-]{1,64}$" $http_x_request_id;
    default                    "Kertas_Kerja_$request_id";
}

server {
    listen 80;
    server_tokens off;

    # Target container API (resolved via Docker DNS 127.0.0.11)
    set $kpr_api http://kpr-kertas-kerja-api:8000;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    # Payload buffer & limits
    client_max_body_size 20m;
    client_body_buffer_size 1m;

    # Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_next_upstream error http_502 http_503 non_idempotent;
    proxy_next_upstream_tries 2;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Routing Default
    location / {
        proxy_pass $kpr_api;
    }

    # Endpoint Initial Kertas Kerja (Memanggil LLM klasifikasi - batas timeout 150s)
    location = /api/v1/kpr/initial-kertas-kerja {
        proxy_pass $kpr_api;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    # Endpoint Kontrak BRIspot
    location /api/v1/kpr/ {
        proxy_pass $kpr_api;
    }

    # Proteksi: Blokir akses luar ke endpoint internal
    location ^~ /internal/ {
        default_type application/json;
        return 404 '{"status_code":404,"status_desc":"Not Found","message":"Not Found","data":null,"request_id":"$req_id","errors":{"code":"NOT_FOUND","detail":null}}';
    }

    # JSON Error Handlers
    error_page 413 = @413;
    error_page 502 = @502;
    error_page 504 = @504;

    location @413 {
        default_type application/json;
        return 413 '{"status_code":413,"status_desc":"Content Too Large","message":"Body request melebihi 20 MB.","data":null,"request_id":"$req_id","errors":{"code":"PAYLOAD_TERLALU_BESAR","detail":null}}';
    }
    location @502 {
        default_type application/json;
        add_header Retry-After 2 always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        return 502 '{"status_code":502,"status_desc":"Bad Gateway","message":"Service sedang tidak tersedia, silakan ulangi.","data":null,"request_id":"$req_id","errors":{"code":"SERVICE_UNAVAILABLE","detail":null}}';
    }
    location @504 {
        default_type application/json;
        add_header Retry-After 2 always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        return 504 '{"status_code":504,"status_desc":"Gateway Timeout","message":"Proses melebihi batas waktu, silakan ulangi.","data":null,"request_id":"$req_id","errors":{"code":"GATEWAY_TIMEOUT","detail":null}}';
    }
}