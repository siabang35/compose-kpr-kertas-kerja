# ==============================================================================
# Docker Compose: Service kpr-kertas-kerja-api (Backend Only)
# ==============================================================================

version: "3.8"

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  kpr-kertas-kerja-api:
    image: ${API_IMAGE:-asia-southeast2-docker.pkg.dev/common-cicd-dev-01/gc-bribrain-dev-gar-temp-01/kpr-kertas-kerja-api:latest}
    container_name: kpr-kertas-kerja-api
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      LIMIT_CONCURRENCY: ${LIMIT_CONCURRENCY:-256}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-kpr_analysis}
      POSTGRES_USER: ${POSTGRES_APP_USER:-kpr_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
      KPR_API_KEY: ${KPR_API_KEY:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    networks:
      kpr-network:
        aliases:
          - api
          - kpr-kertas-kerja-api
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-2.0}"
          memory: 2G

networks:
  kpr-network:
    name: kpr-network
    driver: bridge