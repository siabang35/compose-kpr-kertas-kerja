# ==============================================================================
# Docker Compose: Service kpr-kertas-kerja-nginx (Reverse Proxy Only)
# ==============================================================================

version: "3.8"

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  kpr-kertas-kerja-nginx:
    image: ${NGINX_IMAGE:-asia-southeast2-docker.pkg.dev/common-cicd-dev-01/gc-bribrain-dev-gar-temp-01/kpr-kertas-kerja-nginx:latest}
    container_name: kpr-kertas-kerja-nginx
    restart: unless-stopped
    logging: *logging
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kpr-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  kpr-network:
    external: true
    name: kpr-network